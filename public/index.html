<head>

<style>
:root{--ink:#2d2a5a;--bg:#f6f0e8;--muted:#77728c;--line:#e4dacd;--ok:#23915a;--bad:#d24343;--gold:#ffc928;--soft:#efeaf7}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Sarabun',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;font-size:16px}
select,button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;line-height:1.2}
button:hover{border-color:#c9bba9}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #9b8cf0;outline-offset:1px}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.danger{color:var(--bad);border-color:#f0c9c9}
button.ghost{background:transparent}
select{padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;max-width:100%}
.shell{max-width:1120px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding-top:14px}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:42px;height:42px;border-radius:12px;background:var(--ink);display:grid;place-items:center}
.logo svg{width:28px;height:28px}
h1 .pic{color:var(--ink)} h1 .cab{color:#e8607a}
h1{font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px;margin:0;line-height:1.05}
.brand p{margin:2px 0 0;color:var(--muted);font-size:14px}
.scenebar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.scenebar label{font-size:14px;color:var(--muted)}
.modes{display:flex;gap:6px;margin-top:12px}
.modes button{flex:1;padding:10px 6px;border-radius:12px;font-weight:600;font-size:15px}
.modes button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.modes button:disabled{opacity:.45;cursor:default}
.sub{margin-top:10px;display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;min-height:42px}
.sub .hint{color:var(--muted);font-size:15px}
.sub .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:15px}
.bar{width:120px;height:8px;border-radius:9px;background:#ece5dc;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:9px;transition:width .3s}
.bar.full i{background:var(--ok)}
.toggle.on{background:var(--soft);border-color:#c9bdf0}
.big{font-size:17px;padding:9px 16px;font-weight:600}
.target{font-family:'Fredoka',sans-serif;font-size:22px;font-weight:600;letter-spacing:.3px}
.sub input.name{padding:7px 10px;border:1px solid var(--line);border-radius:10px;min-width:160px}
main{margin-top:10px}
.wrap{position:relative;margin:0 auto;width:100%;border-radius:18px;box-shadow:0 8px 28px rgba(45,42,90,.14);background:#fff}
.fsbtn{position:absolute;top:10px;right:10px;z-index:7;width:38px;height:38px;padding:0;border-radius:11px;border:none;background:rgba(45,42,90,.62);color:#fff;display:grid;place-items:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.fsbtn:hover{background:rgba(45,42,90,.82);border:none}
.fsbtn svg{width:20px;height:20px}
body.editing .fsbtn{top:auto;bottom:10px}
body.fs{overflow:hidden}
body.fs #playView{position:fixed;inset:0;z-index:12;background:var(--bg);overflow:auto;padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
body.fs #playView>main{margin-top:8px}
body.fs .modes{max-width:900px;margin:0 auto}
body.fsside #playView{display:grid;grid-template-columns:minmax(0,1fr) 210px;grid-template-rows:auto 1fr;grid-template-areas:"main modes" "main sub";column-gap:12px;align-items:start}
body.fsside #playView>main{grid-area:main;margin:0;align-self:center}
body.fsside #modes{grid-area:modes;flex-direction:column;margin:0}
body.fsside #modes button{padding:8px 6px;font-size:14px}
body.fsside #sub{grid-area:sub;margin:8px 0 0;flex-direction:column;align-items:stretch}
body.fsside #sub .grow{display:none}
body.fsside #sub>*{max-width:100%}
body.fsside .chips{display:none}
#scene{display:block;width:100%;height:auto;border-radius:18px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body.editing #scene{touch-action:none;cursor:crosshair}
.item{cursor:pointer}
.item.hl{filter:url(#glow)}
.item.good{filter:url(#glowGreen)}
.item.bad{filter:url(#glowRed)}
.hs,.hs.hl,.hs.good,.hs.bad{filter:none!important}
.hs .box{fill:rgba(255,255,255,0);stroke:transparent;stroke-width:3;vector-effect:non-scaling-stroke;pointer-events:all;transition:fill .15s}
.hs.hl .box{fill:rgba(255,201,40,.12);stroke:var(--gold)}
.hs.good .box{fill:rgba(35,145,90,.14);stroke:var(--ok)}
.hs.bad .box{fill:rgba(210,67,67,.14);stroke:var(--bad)}
.spot{fill:rgba(20,18,44,.5);opacity:0;transition:opacity .2s;pointer-events:none}
.spot.on{opacity:1}
body.editing .hs .box{fill:rgba(45,42,90,.16);stroke:#fff;stroke-dasharray:6 4;cursor:move}
body.editing .hs.hl .box{fill:rgba(255,201,40,.3);stroke:var(--gold);stroke-dasharray:none}
.hs .handle{display:none}
body.editing .hs.sel .handle{display:inline;fill:#fff;stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke;cursor:nwse-resize;pointer-events:all}
body.editing.has-sel .hs .box{fill:rgba(255,255,255,0);stroke:transparent;cursor:pointer}
body.editing.has-sel .hs.hl .box{fill:rgba(255,255,255,.12);stroke:rgba(255,255,255,.85);stroke-dasharray:4 4}
body.editing .hs.sel .box,body.editing.has-sel .hs.sel .box{fill:rgba(255,201,40,.2);stroke:var(--gold);stroke-dasharray:none;cursor:move}
.selbar{position:absolute;z-index:7;transform:translate(-50%,-100%);display:flex;gap:4px;align-items:center;background:#fff;border-radius:12px;padding:5px;box-shadow:0 6px 18px rgba(30,25,60,.25);pointer-events:auto;white-space:nowrap}
.selbar b{font-family:'Fredoka',sans-serif;font-size:16px;padding:0 6px 0 4px}
.selbar button{padding:6px 10px;font-size:14px}
.selbar.below{transform:translate(-50%,0)}
body.show-boxes .hs .box{stroke:rgba(255,255,255,.95);stroke-dasharray:5 4}
.brand{border:none;background:transparent;padding:0;text-align:left;cursor:pointer}
.brand:hover{border:none}
.curname{font-family:'Fredoka','Sarabun',sans-serif;font-weight:600;font-size:17px;padding:0 4px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghead{margin:18px 0 12px}
.ghead h2{margin:0;font-size:24px}
.ghead p{margin:4px 0 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-bottom:24px}
.card{display:flex;flex-direction:column;padding:0;border-radius:16px;overflow:hidden;text-align:left;background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(45,42,90,.08);transition:transform .15s, box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(45,42,90,.16);border-color:var(--line)}
.thumb{position:relative;aspect-ratio:4/3;background:#eee6dc;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .tagx{position:absolute;top:8px;left:8px;background:rgba(45,42,90,.85);color:#fff;font-size:12px;border-radius:999px;padding:2px 9px}
.cbody{padding:11px 13px 13px;display:flex;flex-direction:column;gap:5px}
.cbody b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbody .meta{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.cbody .meta .bar{width:70px;height:6px}
.cbody .words{font-family:'Fredoka',sans-serif;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.new{border:2px dashed #c9bba9;background:transparent;box-shadow:none;align-items:center;justify-content:center;min-height:240px;gap:6px;color:var(--ink);text-align:center;padding:16px}
.card.new .big{font-size:36px}
.card.new b{font-size:17px}
.card.new span{font-size:14px;color:var(--muted)}
.mbox.wide{width:min(960px,100%);padding:16px}
.pv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}

.pv-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}

.cont{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 6px 22px rgba(45,42,90,.10)}

.tile .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none}

.libbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}

 .cont{grid-template-columns:1fr}

}

.clue .pat{font-family:'Fredoka',sans-serif;font-size:22px;letter-spacing:1px;margin-top:2px;word-spacing:4px}

.qrow input{flex:1;min-width:0;font-family:'Fredoka',sans-serif;font-size:20px;padding:9px 12px;border:2px solid var(--line);border-radius:12px;outline:none}
.qrow input:focus{border-color:var(--ink)}
.tools{margin-top:8px}
.tools button{flex:1;font-size:14px;padding:7px 6px}
.msg{min-height:22px;margin-top:8px;font-weight:600}
.msg.ok{color:var(--ok)}
.msg.bad{color:var(--bad)}
.msg.info{color:var(--ink)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.chip{border-radius:999px;padding:5px 12px;font-family:'Fredoka',sans-serif;font-weight:500;font-size:15px}
.chip.done{background:#e5f5eb;border-color:#b5dfc5;color:#17683f}
.chip.unk{color:var(--muted)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.settings{display:flex;gap:8px 18px;align-items:center;flex-wrap:wrap;margin:12px 0 28px;font-size:15px;color:var(--muted)}
.settings label{display:flex;align-items:center;gap:6px}
.settings .note{font-size:13px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(30,25,60,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.mbox{background:#fff;border-radius:18px;padding:18px;width:min(440px,100%);box-shadow:0 16px 50px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.mbox h3{margin:0 0 12px;font-size:19px}
.mbox label{display:block;font-size:14px;color:var(--muted);margin-bottom:10px}
.mbox input,.mbox textarea{display:block;width:100%;margin-top:4px;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;font-size:17px;color:var(--ink)}
.mbox input.word{font-family:'Fredoka',sans-serif;font-size:20px}
.mbox textarea{font-size:12px;height:140px;font-family:ui-monospace,monospace}
.mbox .createrow{margin:4px 0 6px}
.mbox .orline{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:16px 0 4px}
.mbox .orline::before,.mbox .orline::after{content:"";flex:1;height:1px;background:var(--line)}
.mbox.drop{outline:3px dashed var(--accent,#7c5cff);outline-offset:-8px}
.mbox .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.mbox .row .sp{flex:1}
.mbox p{margin:0 0 12px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:calc(100% - 32px);text-align:center;font-size:15px}
.toast.show{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
@media (max-width:640px){
 h1{font-size:19px}.brand p{font-size:13px}
 .modes button{font-size:13.5px;padding:9px 4px}
 .tag b{font-size:17px}.tag small{font-size:13px}
 .mini{font-size:10.5px;padding:1px 5px}
 .qcard{position:fixed;left:10px!important;right:10px;top:10px!important;width:auto}
 .badge{width:20px;height:20px;font-size:11px}
 .sub .hint{font-size:14px}
 /* tidy play screen: picture → word card → word strip → controls */
 #playView:not([hidden]){display:flex;flex-direction:column}
 #modes{order:1} #playView>main{order:2} #sub{order:3;margin-top:6px}
 .sub .tip{display:none}
 .sub{gap:6px}
 .sub .seg button{padding:8px 9px;font-size:14.5px}
 .sub .icon{width:38px;height:38px;padding:0;font-size:17px;flex:none}
 .sub .play{width:50px;height:38px;padding:0;font-size:17px;flex:none}
 .sub .bar{width:56px}
 .chips{display:none!important}
 .sub .listbtn{font-weight:600;background:var(--soft);border-color:#c9bdf0;white-space:nowrap;padding:8px 10px;font-size:14.5px}
 .modal.sheetmode{align-items:flex-end;padding:0}
 .mbox.sheet{width:100%;border-radius:18px 18px 0 0;max-height:72vh;padding:12px 14px 18px}
}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.sheethead b{font-size:17px}
.sheethead button{width:36px;height:36px;padding:0;border-radius:50%}
.wlist{display:flex;flex-direction:column;gap:6px}
.wrow{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:9px 12px;border-radius:12px}
.wrow b{font-family:'Fredoka',sans-serif;font-size:17px;font-weight:600}
.wrow small{color:var(--muted);font-size:13.5px}
.wrow.on{background:var(--ink);border-color:var(--ink);color:#fff}
.wrow.on small{color:#d9d4f0}
.wrow.done{background:#e5f5eb;border-color:#b5dfc5}
.wrow.unk b{color:var(--muted);font-family:inherit;font-weight:500}
.mbox.sheet label{display:block;margin-top:10px}
</style>
</head>

function el(tagName, props, ...kids){

  if(props) for(const k in props){
    if(k==='class') e.className=props[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), props[k]);
    else if(k==='text') e.textContent=props[k];

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function norm(s){ return String(s).toLowerCase().trim().replace(/\bthree\b/g,'3').replace(/cozy/g,'cosy').replace(/savory/g,'savoury').replace(/[^a-z0-9]/g,''); }
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,j)=>j); for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
function matches(v,it){ const n=norm(v); if(!n) return false; return [it.word].concat(it.alts||[]).some(w=>{ const t=norm(w); return n===t||n===t+'s'||n===t+'es'; }); }

  const L=lang.toLowerCase();

    speechSynthesis.cancel();

const AP={ on:false, playing:false, order:store.get('pv-ap-order','seq'), gap:store.get('pv-ap-gap',1800), queue:[], idx:0, token:0, timer:null };
const AP_ORDERS={seq:'ตามลำดับในฉาก', az:'เรียง A→Z', rand:'สุ่ม'};

function apList(){
  let l=ids().slice();

function apCounter(){ const c=$('#apCount'); if(c) c.textContent=(c.tagName==='BUTTON'?'📖 ':'')+(AP.queue.length?`${Math.min(AP.idx+1,AP.queue.length)}/${AP.queue.length}`:`${ids().length} คำ`); }
function apStep(){
  if(!AP.playing) return;
  if(!AP.queue.length || AP.idx>=AP.queue.length){ AP.queue=apList(); AP.idx=0; }   // loop (reshuffles when random)
  const id=AP.queue[AP.idx];
  if(!items()[id]){ AP.idx++; return apStep(); }
  apShow(id);
  const tk=++AP.token;
  speak(sayOf(id), ()=>{
    if(tk!==AP.token || !AP.playing) return;
    AP.timer=setTimeout(()=>{ if(tk!==AP.token || !AP.playing) return; AP.idx++; apStep(); }, AP.gap);
  });
}

// Box as drawn: a little breathing room around the object and rounded corners.
function boxGeom(it){
  const sc=scene(), m=Math.max(sc.w,sc.h), p=m*0.006;
  const x=it.x-p, y=it.y-p, w=it.w+2*p, h=it.h+2*p;
  return {x, y, w, h, r:Math.min(Math.min(w,h)*0.2, m*0.022)};
}
function rrPath(g){
  const {x,y,w,h,r}=g;
  return `M${x+r} ${y}H${x+w-r}A${r} ${r} 0 0 1 ${x+w} ${y+r}V${y+h-r}A${r} ${r} 0 0 1 ${x+w-r} ${y+h}H${x+r}A${r} ${r} 0 0 1 ${x} ${y+h-r}V${y+r}A${r} ${r} 0 0 1 ${x+r} ${y}Z`;
}

function layoutHs(id){

function ago(ts){
  if(!ts) return 'ยังไม่เคยเปิด';
  const sec=(Date.now()-ts)/1000;
  if(sec<90) return 'เมื่อครู่';
  if(sec<3600) return Math.round(sec/60)+' นาทีที่แล้ว';
  if(sec<86400) return Math.round(sec/3600)+' ชั่วโมงที่แล้ว';
  const d=Math.floor(sec/86400);
  if(d===1) return 'เมื่อวานนี้';
  if(d<7) return d+' วันก่อน';
  if(d<14) return 'สัปดาห์ที่แล้ว';
  if(d<60) return Math.floor(d/7)+' สัปดาห์ก่อน';
  return new Date(ts).toLocaleDateString('th-TH',{day:'numeric',month:'short'});
}

// Scene image cropped to a frame (like object-fit: cover) with up to 4 word labels that stay on their objects.
function labeledImg(sc, ar){
  const sv=document.createElementNS(NS,'svg');
  sv.setAttribute('viewBox',`0 0 ${sc.w} ${sc.h}`); sv.setAttribute('preserveAspectRatio','xMidYMid slice');
  const im=document.createElementNS(NS,'image');
  im.setAttribute('href',sceneImg(sc)); im.setAttribute('width',sc.w); im.setAttribute('height',sc.h); im.setAttribute('preserveAspectRatio','none');
  sv.appendChild(im);
  const ia=sc.w/sc.h; let vx0=0,vx1=sc.w,vy0=0,vy1=sc.h;
  if(ia>ar){ const vw=sc.h*ar; vx0=(sc.w-vw)/2; vx1=vx0+vw; } else { const vh=sc.w/ar; vy0=(sc.h-vh)/2; vy1=vy0+vh; }
  const VW=vx1-vx0, fs=VW*0.036, picks=[];
  for(const it of Object.values(sc.items)){
    const a=anchorOf(it); if(!a) continue;
    if(a.x<vx0+VW*0.1||a.x>vx1-VW*0.1||a.y<vy0+fs*2.2||a.y>vy1-fs*2.2) continue;
    if(picks.some(p=>Math.abs(p.x-a.x)<VW*0.3 && Math.abs(p.y-a.y)<fs*3.6)) continue;
    picks.push({x:a.x,y:a.y,it}); if(picks.length>=4) break;
  }
  for(const {x,y,it} of picks){
    const th=(it.th||'').split(' (')[0].slice(0,18);
    const w=Math.max(it.word.length*0.56*fs, th.length*0.36*fs)+fs*1.3, hh=th?fs*2.45:fs*1.6;
    const x0=Math.max(vx0+fs*0.3,Math.min(vx1-w-fs*0.3,x-w/2)), y0=Math.max(vy0+fs*0.3,Math.min(vy1-hh-fs*0.3,y-hh/2));
    const g=document.createElementNS(NS,'g');
    const r=document.createElementNS(NS,'rect');
    Object.entries({x:x0,y:y0,width:w,height:hh,rx:hh*0.32,fill:'#fff','fill-opacity':.94}).forEach(([k,v])=>r.setAttribute(k,v));
    const t1=document.createElementNS(NS,'text');
    Object.entries({x:x0+fs*0.65,y:y0+fs*1.15,'font-size':fs,'font-weight':600,fill:'#2d2a5a','font-family':'Fredoka, sans-serif'}).forEach(([k,v])=>t1.setAttribute(k,v));
    t1.textContent=it.word; g.append(r,t1);
    if(th){ const t2=document.createElementNS(NS,'text');
      Object.entries({x:x0+fs*0.65,y:y0+fs*2.05,'font-size':fs*0.72,fill:'#77728c','font-family':'Sarabun, sans-serif'}).forEach(([k,v])=>t2.setAttribute(k,v));
      t2.textContent=th; g.append(t2); }
    sv.appendChild(g);
  }
  return sv;
}

const LIB={q:'',f:'all',sort:'recent'};
const LIB_LABELS={all:'ทั้งหมด',mine:'ของฉัน',sample:'ตัวอย่าง'};
function renderLibrary(){

      if(w){ hits[sc.id]=w.word; return true; }

    });
  }
  if(LIB.sort==='name') list.sort((a,b)=>a.name.localeCompare(b.name));
  else if(LIB.sort==='todo') list.sort((a,b)=>{ const A=progOf(a), B=progOf(b); return (B.n-B.d)-(A.n-A.d); });
  else list.sort(byRecent);

function previewSvg(sc, showLabels){
  const s=document.createElementNS(NS,'svg');
  s.setAttribute('viewBox',`0 0 ${sc.w} ${sc.h}`);
  const im=document.createElementNS(NS,'image');
  im.setAttribute('href',sceneImg(sc)); im.setAttribute('width',sc.w); im.setAttribute('height',sc.h); im.setAttribute('preserveAspectRatio','none');
  s.appendChild(im);
  if(!showLabels) return s;
  const fs=Math.max(sc.w,sc.h)*(sc.w>=sc.h?0.016:0.025);
  for(const it of Object.values(sc.items)){
    let x,y;
    if(it.at){ x=it.at[0]; y=it.at[1]; }
    else {
      x=it.x+it.w/2; y=it.y+fs*0.9;
      const r=document.createElementNS(NS,'rect');
      Object.entries({x:it.x,y:it.y,width:it.w,height:it.h,rx:Math.min(it.w,it.h)*0.08,fill:'none',stroke:'#ffc928','stroke-width':Math.max(2,fs*0.16)}).forEach(([k,v])=>r.setAttribute(k,v));
      s.appendChild(r);
    }
    const w=it.word.length*fs*0.56+fs*1.1, h=fs*1.55;
    x=Math.max(w/2+2, Math.min(sc.w-w/2-2, x)); y=Math.max(h/2+2, Math.min(sc.h-h/2-2, y));
    const bg=document.createElementNS(NS,'rect');
    Object.entries({x:x-w/2,y:y-h/2,width:w,height:h,rx:h*0.3,fill:'#fff','fill-opacity':.94,stroke:'#2d2a5a','stroke-opacity':.15}).forEach(([k,v])=>bg.setAttribute(k,v));
    const t=document.createElementNS(NS,'text');
    Object.entries({x,y,'text-anchor':'middle','dominant-baseline':'central','font-size':fs,fill:'#2d2a5a',class:'pvl'}).forEach(([k,v])=>t.setAttribute(k,v));
    t.textContent=it.word;
    s.append(bg,t);
  }
  return s;
}
function openPreview(id){
  const sc=scenes().find(x=>x.id===id); if(!sc) return;

  openModal(m=>{

function setHL(){

  svg.querySelectorAll('.item').forEach(e=>{

function setHover(id){

  hoverId=id;

function updateTag(){
  let id=null, pinned=false, kind='';
  if(!S.editing){
    if(flash){ id=flash.id; kind=flash.kind; pinned=true; }
    else if(S.mode==='learn'){ id=hoverId||pinnedId; pinned=!!pinnedId && id===pinnedId; }
  }
  const it=id && items()[id];
  if(!it){ tag.hidden=true; return; }
  tag.innerHTML='';

  if(kind==='bad') txt.append(el('small',{class:'why',text:'ยังไม่ใช่ — อันนี้คือ'}));
  txt.append(el('b',{text:it.word}));

  tag.className='tag'+(pinned?' pinned':'')+(kind?' '+kind:'');

function updateOverlay(){
  overlay.innerHTML='';
  const W=wrap.getBoundingClientRect().width;
  if(S.editing){
    const sc=scene(), ctm=svg.getScreenCTM(); if(sc.builtin||!ctm) return;
    const wr=wrap.getBoundingClientRect();
    const at=(x,y)=>{ const p=svg.createSVGPoint(); p.x=x; p.y=y; const q=p.matrixTransform(ctm); return {x:q.x-wr.left, y:q.y-wr.top}; };
    if(selId && sc.items[selId]){
      // Only the selected box: its word + a small action bar.
      const it=sc.items[selId], top=at(it.x+it.w/2, it.y), bot=at(it.x+it.w/2, it.y+it.h);

        el('button',{text:'✕','aria-label':'ยกเลิกการเลือก',onclick:e=>{e.stopPropagation(); selectBox(null);}}));
      overlay.append(bar);

      bar.style.left=clampX(bar, top.x, W)+'px';
      if(!S.allBoxes) return;
    }
    for(const [id,it] of Object.entries(sc.items)){
      if(id===selId) continue;
      const q=at(it.x+it.w/2, it.y);
      const m=el('div',{class:'mini edit',text:it.word,onclick:e=>{e.stopPropagation(); selectBox(id);}});

let lastDown=null;
svg.addEventListener('pointerdown', e=>{ lastDown={x:e.clientX, y:e.clientY, t:Date.now(), touch:e.pointerType!=='mouse'}; }, true);
function itemAtClick(e){
  if(lastDown && lastDown.touch && Date.now()-lastDown.t<1000){
    const t=document.elementFromPoint(lastDown.x, lastDown.y);
    return t && svg.contains(t) ? t.closest('.item') : null;
  }
  return e.target.closest('.item');
}

// ---------- editor ----------
let drawing=null, drag=null, drewAt=0;
function dragMove(e){
  if(!drag.moved && Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy)<5) return;
  drag.moved=true;
  const sc=scene(), it=sc.items[drag.id]; if(!it) return;
  const p=toSvg(e), dx=p.x-drag.p0.x, dy=p.y-drag.p0.y, o=drag.o, min=Math.max(sc.w,sc.h)*0.015;
  if(drag.mode==='resize'){
    it.w=Math.max(min, Math.min(sc.w-o.x, o.w+dx)); it.h=Math.max(min, Math.min(sc.h-o.y, o.h+dy));
  } else {
    it.x=Math.max(0, Math.min(sc.w-o.w, o.x+dx)); it.y=Math.max(0, Math.min(sc.h-o.h, o.y+dy));
  }
  layoutHs(drag.id); updateOverlay();
}
function toSvg(e){ const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function updDraft(p){
  if(!drawing) return; const sc=scene();
  const x2=Math.max(0,Math.min(sc.w,p.x)), y2=Math.max(0,Math.min(sc.h,p.y));
  const x=Math.min(drawing.x0,x2), y=Math.min(drawing.y0,y2), w=Math.abs(x2-drawing.x0), h=Math.abs(y2-drawing.y0);
  Object.assign(drawing,{x,y,w,h});
  drawing.r.setAttribute('x',x); drawing.r.setAttribute('y',y); drawing.r.setAttribute('width',w); drawing.r.setAttribute('height',h);
}
svg.addEventListener('pointerdown', e=>{
  if(!S.editing || e.button>0) return;
  e.preventDefault();
  const p=toSvg(e), sc=scene();
  // Hit-test ourselves instead of trusting the topmost element, so overlapping boxes behave:
  //  1) the resize handle of the selected box wins, 2) the selected box wins for dragging,
  //  3) otherwise the smallest box under the pointer is picked.
  const under=boxesAt(p);
  let id=null, mode='move';
  if(e.target.classList && e.target.classList.contains('handle') && selId){ id=selId; mode='resize'; }
  else if(selId && under.includes(selId)) id=selId;
  else if(under.length) id=under[0];
  if(id){
    const it=sc.items[id]; if(!it) return;
    drag={id, mode, under, p0:p, o:{x:it.x,y:it.y,w:it.w,h:it.h}, moved:false, sx:e.clientX, sy:e.clientY};
    try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    return;
  }
  const r=document.createElementNS(NS,'rect'); r.setAttribute('class','draft'); svg.appendChild(r);
  drawing={x0:Math.max(0,Math.min(sc.w,p.x)), y0:Math.max(0,Math.min(sc.h,p.y)), r, x:0,y:0,w:0,h:0};
  try{ svg.setPointerCapture(e.pointerId); }catch(_){}
});
function boxesAt(p){
  // ids of boxes containing point p, smallest first
  return Object.entries(scene().items)
    .filter(([,it])=>p.x>=it.x && p.x<=it.x+it.w && p.y>=it.y && p.y<=it.y+it.h)
    .sort((a,b)=>a[1].w*a[1].h-b[1].w*b[1].h).map(([id])=>id);
}
function orderHs(){
  // Stack order: big boxes underneath, small ones on top, the selected one above all.
  const its=items();
  const gs=[...svg.querySelectorAll('.hs')];
  gs.sort((a,b)=>{
    if(a.dataset.id===selId) return 1; if(b.dataset.id===selId) return -1;
    const A=its[a.dataset.id], B=its[b.dataset.id];
    return (B?B.w*B.h:0)-(A?A.w*A.h:0);
  });
  gs.forEach(g=>svg.appendChild(g));
}
function endDraw(){
  if(!drawing) return;
  const d=drawing; drawing=null; drewAt=Date.now();
  const sc=scene(), min=Math.max(sc.w,sc.h)*0.015;
  if(d.w<min || d.h<min){ d.r.remove(); if(selId) selectBox(null); else toast('ลากให้เป็นกรอบล้อมรอบสิ่งของนะ'); return; }
  openItemForm(null, {x:Math.round(d.x),y:Math.round(d.y),w:Math.round(d.w),h:Math.round(d.h)}, d.r);
}
svg.addEventListener('pointerup', ()=>{
  if(drag){
    const d=drag; drag=null; drewAt=Date.now();
    const it=scene().items[d.id];
    if(d.moved && it){ ['x','y','w','h'].forEach(k=>it[k]=Math.round(it[k])); saveScenes(); selectBox(d.id); }
    else if(d.id!==selId) selectBox(d.id);       // first tap → just select & show this box only
    else if(d.mode==='move' && d.under.length>1){
      // Tapping the selected box where several boxes overlap → cycle to the next one underneath.
      const i=d.under.indexOf(selId), next=d.under[(i+1)%d.under.length];
      selectBox(next); toast('สลับไปกรอบ “'+scene().items[next].word+'” — แตะซ้ำเพื่อสลับต่อ', 1800);
    }
    else if(d.mode==='move') openItemForm(d.id); // second tap on a lone selected box → edit
    return;
  }
  endDraw();
});
svg.addEventListener('pointercancel', ()=>{
  if(drawing){ drawing.r.remove(); drawing=null; }
  if(drag){ const it=scene().items[drag.id]; if(it) Object.assign(it, drag.o); layoutHs(drag.id); drag=null; updateOverlay(); }
});

      el('h3',{text:'✨ ให้ AI หาคำศัพท์ในรูป'}),
      el('p',{text:'AI จะดูรูป ตีกรอบรอบสิ่งของ และใส่คำศัพท์พร้อมคำแปลให้ จากนั้นคุณแก้ไขหรือย้ายกรอบได้'}),
      el('label',{},'จำนวนคำสูงสุด', cnt),
      el('label',{},'ระดับคำศัพท์', lv),
      has ? el('div',{}, el('label',{class:'opt'}, add, 'เพิ่มต่อจากคำที่มีอยู่ ('+has+' คำ)'), el('label',{class:'opt'}, rep, 'ลบคำเดิมทั้งหมดแล้วสร้างใหม่')) : null,
      el('div',{class:'row'}, el('span',{class:'sp'}),
        el('button',{text:'ยกเลิก',onclick:closeModal}),
        el('button',{class:'primary',text:'✨ เริ่มเลย',onclick:()=>{
          const opts={count:+cnt.value, level:lv.value, replace:!has||rep.checked};
          store.set('pv-ai-count',opts.count); store.set('pv-ai-level',opts.level);
          closeModal(); runAI(opts);
        }}))
    );
  });
}
function showBusy(on){
  $('#busy').hidden=!on; clearInterval(aiTimer);
  if(on){
    const t0=Date.now(); $('#busyTime').textContent='ปกติใช้เวลาประมาณ 20–60 วินาที';
    aiTimer=setInterval(()=>{ $('#busyTime').textContent=`ผ่านไป ${Math.round((Date.now()-t0)/1000)} วินาที (ปกติ 20–60 วินาที)`; },1000);
  }
}
$('#aiStop').addEventListener('click',()=>{ if(aiCtl) aiCtl.abort(); });
async function runAI({count=20, level='mid', replace=true}={}){
  const sc=scene();
  if(!aiReady){ toast('ตอนนี้ใช้ AI ไม่ได้ — ลากกรอบบนรูปเพื่อใส่คำศัพท์เองได้'); return; }
  if(sc.builtin || aiCtl) return;
  let code=store.get('pv-ai-code','');
  if(aiNeedCode && !code){ code=await askCode(false); if(!code) return; store.set('pv-ai-code',code); }
  const existing = replace ? [] : Object.values(sc.items).map(i=>i.word);
  aiCtl=new AbortController(); showBusy(true);
  let retryCode=false;
  try{
    let r;
    try{
      r=await fetch('/api/scan',{method:'POST', signal:aiCtl.signal,
        headers:{'content-type':'application/json', ...(code?{'x-piccab-code':code}:{})},
        body:JSON.stringify({image:sc.img, count, level, existing})});
    }catch(e){ throw {code: e && e.name==='AbortError' ? 'cancelled' : 'offline'}; }
    const data=await r.json().catch(()=>({}));
    if(!r.ok) throw {code:data.error||'error'};
    const arr=Array.isArray(data.items)?data.items:[];
    if(replace) sc.items={};
    const seen=new Set(Object.values(sc.items).map(i=>norm(i.word)));
    let added=0;
    for(const r of arr){
      if(!r || typeof r.word!=='string' || !Array.isArray(r.box) || r.box.length<4) continue;
      const word=r.word.trim().replace(/\s+/g,' ').slice(0,60); const key=norm(word);
      if(!key || seen.has(key)) continue;
      const b=r.box.slice(0,4).map(v=>Math.max(0,Math.min(1000,Number(v))));
      if(b.some(v=>!Number.isFinite(v))) continue;
      const x0=Math.min(b[0],b[2]), x1=Math.max(b[0],b[2]), y0=Math.min(b[1],b[3]), y1=Math.max(b[1],b[3]);
      if(x1-x0<8 || y1-y0<8) continue;
      seen.add(key);
      sc.items['h'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)]={
        word, th:String(r.th||'').trim().slice(0,120),
        alts:Array.isArray(r.alts)?r.alts.filter(a=>typeof a==='string'&&a.trim()).slice(0,4).map(a=>a.trim().slice(0,60)):[],
        x:Math.round(x0/1000*sc.w), y:Math.round(y0/1000*sc.h), w:Math.round((x1-x0)/1000*sc.w), h:Math.round((y1-y0)/1000*sc.h)
      };
      added++;
    }
    saveScenes(); help={}; used={}; if(replace){ progress[sc.id]={done:{},star:{}}; saveProg(); }
    if(scene()===sc){ renderScene(); refresh(); }
    toast((added ? `✨ ได้คำศัพท์ ${added} คำ — ตรวจดูกรอบ ลากย้าย/ปรับขนาด หรือแตะเพื่อแก้คำได้ แล้วกด ✓ เสร็จแล้ว` : 'AI ไม่พบสิ่งของใหม่ในรูปนี้')+(data.model?` · AI: ${data.model}`:''), 6000);
  }catch(e){
    const c=e && e.code;
    if(c==='bad_code'){ store.set('pv-ai-code',''); aiNeedCode=true; retryCode=true; }
    else if(c!=='cancelled') toast(aiErr(c), 5000);
    if(c==='not_configured'){ aiReady=false; refresh(); }
  }finally{ aiCtl=null; showBusy(false); }
  if(retryCode){
    const c2=await askCode(true);
    if(c2){ store.set('pv-ai-code',c2); runAI({count, level, replace}); }
  }
}

function openItemForm(id, rect, draftEl){
  const sc=scene(); if(sc.builtin) return;
  const it=id?sc.items[id]:null;
  modalClose=()=>{ if(draftEl) draftEl.remove(); };
  openModal(m=>{
    const w=el('input',{class:'word',value:it?it.word:'',placeholder:'เช่น teapot',autocapitalize:'none',spellcheck:'false'});
    const th=el('input',{value:it?(it.th||''):'',placeholder:'เช่น กาน้ำชา'});
    const al=el('input',{value:it&&it.alts?it.alts.join(', '):'',placeholder:'เช่น tea pot (คั่นด้วย ,)',autocapitalize:'none',spellcheck:'false'});
    const save=()=>{
      const word=w.value.trim().replace(/\s+/g,' ');
      if(!word){ w.focus(); toast('พิมพ์คำศัพท์ภาษาอังกฤษก่อนนะ'); return; }
      const alts=al.value.split(',').map(s=>s.trim()).filter(Boolean).slice(0,6);
      if(it){ it.word=word; it.th=th.value.trim(); it.alts=alts; }
      else{ const nid='h'+Date.now().toString(36)+Math.random().toString(36).slice(2,5); sc.items[nid]=Object.assign({word, th:th.value.trim(), alts}, rect); selId=nid; }
      saveScenes(); closeModal(); renderScene(); refresh();
    };
    [w,th,al].forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); save(); } }));
    m.append(
      el('h3',{text:it?'แก้ไขคำศัพท์':'เพิ่มคำศัพท์'}),
      el('label',{},'คำภาษาอังกฤษ', w),
      el('label',{},'ความหมายภาษาไทย (ไม่บังคับ)', th),
      el('label',{},'คำตอบอื่นที่ให้ถือว่าถูก (ไม่บังคับ)', al),
      el('div',{class:'row'},
        el('button',{text:'🔊 ลองฟัง',onclick:()=>speak(w.value.trim())}),
        el('span',{class:'sp'}),
        it?el('button',{class:'danger',text:'ลบ',onclick:()=>{ delete sc.items[id]; if(selId===id) selId=null; saveScenes(); closeModal(); renderScene(); refresh(); }}):null,
        el('button',{text:'ยกเลิก',onclick:closeModal}),
        el('button',{class:'primary',text:'บันทึก',onclick:save})
      )
    );
  });
}
function loadImageFile(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=1400; let w=img.naturalWidth, h=img.naturalHeight; const s=Math.min(1,max/Math.max(w,h));
        w=Math.round(w*s); h=Math.round(h*s);
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
        res({src:c.toDataURL('image/jpeg',0.82), w, h});
      };
      img.onerror=rej; img.src=fr.result;
    };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}
async function onPickImage(e){
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  createSceneFromFile(f);
}
async function createSceneFromFile(f){
  try{
    const im=await loadImageFile(f);
    const nm=f.name.replace(/\.[^.]+$/,''); const sc={id:'s'+Date.now().toString(36), name:(/^(image|img|photo|IMG|DSC|PXL)[-_ ]?\d*/i.test(nm)||!nm ? 'ฉากใหม่ '+new Date().toLocaleDateString('th-TH',{day:'numeric',month:'short'}) : nm).slice(0,40), img:im.src, w:im.w, h:im.h, items:{}};
    customs.push(sc); saveScenes();
    S.sceneId=sc.id; store.set('pv-scene',sc.id); S.editing=true; S.view='play'; help={}; used={}; recent[sc.id]=Date.now(); store.set('pv-recent',recent); markActive(0);
    fullRender(); window.scrollTo(0,0);
    if(aiReady) runAI({count:store.get('pv-ai-count',20), level:store.get('pv-ai-level','mid'), replace:true});
    else toast('ลากกรอบรอบสิ่งของในรูป แล้วพิมพ์คำศัพท์', 4000);
  }catch(err){ toast('เปิดรูปนี้ไม่ได้ ลองไฟล์ .jpg หรือ .png'); }
}
$('#fileImg').addEventListener('change', onPickImage);
$('#fileCam').addEventListener('change', onPickImage);
function deleteScene(){
  const sc=scene(); if(sc.builtin) return;
  ask(`ลบฉาก “${sc.name}” ใช่ไหม? ลบแล้วกู้คืนไม่ได้`,'ลบฉาก').then(ok=>{

    customs=customs.filter(s=>s!==sc); delete progress[sc.id]; saveScenes(); saveProg();

async function exportScene(){
  const sc=scene();
  const data=JSON.stringify({app:'piccab',v:1,name:sc.name,img:sc.img,w:sc.w,h:sc.h,items:sc.items});
  try{ await navigator.clipboard.writeText(data); toast('คัดลอกแล้ว — วางเก็บในไฟล์ข้อความ หรือส่งให้เพื่อนกด 📥 นำเข้า', 4000); }
  catch(e){
    openModal(m=>{

      m.append(el('h3',{text:'ข้อมูลฉาก'}), el('p',{text:'คัดลอกข้อความทั้งหมดนี้ไปเก็บไว้ หรือส่งให้เพื่อนนำเข้า'}), ta,
        el('div',{class:'row'}, el('span',{class:'sp'}), el('button',{class:'primary',text:'ปิด',onclick:closeModal})));
      setTimeout(()=>{ ta.focus(); ta.select(); },50);
    });
  }
}
function importData(text){
  let o; try{ o=JSON.parse(text); }catch(e){ toast('ข้อมูลไม่ถูกต้อง'); return false; }
  if(!o || typeof o.img!=='string' || !o.img.startsWith('data:image/') || !(o.w>0) || !(o.h>0) || typeof o.items!=='object'){ toast('ข้อมูลไม่ใช่ฉากของแอปนี้'); return false; }
  const its={};
  for(const [k,v] of Object.entries(o.items)){
    if(!v || typeof v.word!=='string') continue;
    const n=x=>Number.isFinite(+x)?+x:0;
    its['h'+Math.random().toString(36).slice(2,9)]={word:v.word.slice(0,80), th:String(v.th||'').slice(0,120), alts:Array.isArray(v.alts)?v.alts.filter(a=>typeof a==='string').slice(0,4).map(a=>a.slice(0,60)):[], x:n(v.x), y:n(v.y), w:n(v.w), h:n(v.h)};
  }
  const sc={id:'s'+Date.now().toString(36), name:String(o.name||'ฉากที่นำเข้า').slice(0,50), img:o.img, w:+o.w, h:+o.h, items:its};
  customs.push(sc); saveScenes(); S.sceneId=sc.id; store.set('pv-scene',sc.id); help={}; used={};
  S.view='library'; fullRender(); toast('นำเข้าฉาก “'+sc.name+'” แล้ว ✓'); return true;
}
const isImageFile=f=>!!f && (/^image\//.test(f.type) || /\.(jpe?g|png|gif|webp|heic|heif|bmp)$/i.test(f.name||''));
function importFile(f){
  if(!f) return;
  if(isImageFile(f)){ closeModal(); createSceneFromFile(f); return; }
  const fr=new FileReader(); fr.onload=()=>{ if(importData(fr.result)) closeModal(); }; fr.readAsText(f);
}
function openImport(){
  openModal(m=>{
    const ta=el('textarea',{placeholder:'วางข้อมูลฉากที่คัดลอกไว้ หรือวางรูป (Ctrl+V) ที่นี่…'});
    m.append(el('h3',{text:'เพิ่มฉากใหม่'}),
      el('p',{text: aiReady ? 'ใส่รูปแล้ว AI จะหาคำศัพท์ให้อัตโนมัติ' : 'ใส่รูปแล้วลากกรอบรอบสิ่งของเพื่อใส่คำศัพท์'}),
      el('div',{class:'createrow'},
        el('button',{class:'cbtn',onclick:()=>{ closeModal(); $('#fileCam').click(); }},'📷 ถ่ายรูป'),
        el('button',{class:'cbtn',onclick:()=>{ closeModal(); $('#fileImg').click(); }},'🖼 เลือกรูป')),
      el('div',{class:'orline',text:'หรือนำเข้าฉากที่บันทึกไว้'}),
      el('p',{text:'วางข้อมูลจากปุ่ม “📋 คัดลอกข้อมูลฉาก” หรือเลือกไฟล์ (ลากรูปหรือไฟล์มาวางในกล่องนี้ก็ได้)'}), ta,
      el('div',{class:'row'},
        el('button',{text:'📄 เลือกไฟล์',onclick:()=>$('#fileJson').click()}),
        el('span',{class:'sp'}),
        el('button',{text:'ยกเลิก',onclick:closeModal}),
        el('button',{class:'primary',text:'นำเข้า',onclick:()=>{ if(importData(ta.value)) closeModal(); }})));
    // paste an image (e.g. a screenshot) straight into the box
    ta.addEventListener('paste',e=>{
      const f=[...((e.clipboardData&&e.clipboardData.files)||[])].find(isImageFile);
      if(f){ e.preventDefault(); importFile(f); }
    });
  });
  // on phones, don't pop the keyboard open over the photo buttons
  if(matchMedia('(pointer:coarse)').matches) setTimeout(()=>{ if(document.activeElement && document.activeElement.tagName==='TEXTAREA') document.activeElement.blur(); },60);
}
// drag & drop an image or scene file onto the import box
const mbox=$('#mbox');
mbox.addEventListener('dragover',e=>{ if(mbox.querySelector('.orline') && e.dataTransfer && [...e.dataTransfer.types].includes('Files')){ e.preventDefault(); mbox.classList.add('drop'); } });
mbox.addEventListener('dragleave',e=>{ if(!mbox.contains(e.relatedTarget)) mbox.classList.remove('drop'); });
mbox.addEventListener('drop',e=>{
  mbox.classList.remove('drop');
  if(!mbox.querySelector('.orline')) return;
  const f=e.dataTransfer && e.dataTransfer.files[0]; if(!f) return;
  e.preventDefault(); importFile(f);
});
$('#fileJson').addEventListener('change', e=>{
  const f=e.target.files[0]; e.target.value=''; importFile(f);
});

// ---------- layout updates ----------
const relayout=()=>{ updateTag(); updateOverlay(); positionQ(); };
// ---------- full screen (the scene fills the screen; tabs and controls stay) ----------
const FS_IN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>', FS_OUT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
const isFs=()=>document.body.classList.contains('fs');
function fitWrap(){
  const sc=scene(), r=sc.w/sc.h;
  if(!isFs()){ wrap.style.maxWidth=`calc(${isMobile()?56:86}vh * ${r})`; return; }
  const pv=$('#playView'), short=window.innerHeight<560 && window.innerWidth>window.innerHeight;
  if(document.body.classList.contains('fsside')!==short){ document.body.classList.toggle('fsside', short); renderSub(); renderChips(); }
  let availH, availW;
  if(short){                                                   // landscape phone: picture left, controls in a side column
    const cs=getComputedStyle(pv);
    availH=window.innerHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-2;
    availW=pv.querySelector('main').clientWidth;
  } else {
    availH=window.innerHeight-(pv.scrollHeight-wrap.offsetHeight)-6;   // minus tabs, controls, word chips, padding
    availW=pv.clientWidth;
  }
  wrap.style.maxWidth=Math.max(200, Math.min(availW, Math.max(160,availH)*r))+'px';
}
function setFsUi(on){
  document.body.classList.toggle('fs', on); if(!on) document.body.classList.remove('fsside');
  const b=$('#fsBtn'); b.innerHTML=on?FS_OUT:FS_IN; b.setAttribute('aria-label', on?'ออกจากเต็มจอ':'เต็มจอ'); b.title=b.getAttribute('aria-label');
  fitWrap(); requestAnimationFrame(()=>{ fitWrap(); relayout(); });
}
async function enterFs(){
  setFsUi(true);
  // Real full screen where the browser allows it (hides the address bar); otherwise the page-level layout above still applies (e.g. iPhone).
  const de=document.documentElement, req=de.requestFullscreen||de.webkitRequestFullscreen;
  if(req && !(document.fullscreenElement||document.webkitFullscreenElement)){
    try{ await req.call(de,{navigationUI:'hide'}); }catch(e){}
    // Landscape scenes on phones: turn to landscape when the browser supports it.
    const sc=scene();
    if(isMobile() && sc.w>sc.h && screen.orientation && screen.orientation.lock){ screen.orientation.lock('landscape').catch(()=>{}); }
  }
}
function exitFs(){
  if(document.fullscreenElement||document.webkitFullscreenElement){
    try{ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }catch(e){}
  }
  try{ screen.orientation && screen.orientation.unlock && screen.orientation.unlock(); }catch(e){}
  setFsUi(false);
}
$('#fsBtn').addEventListener('click', e=>{ e.stopPropagation(); isFs()?exitFs():enterFs(); });
['fullscreenchange','webkitfullscreenchange'].forEach(t=>document.addEventListener(t,()=>{
  // Leaving the browser's full screen (Esc, back gesture) also leaves our layout.
  if(!(document.fullscreenElement||document.webkitFullscreenElement) && isFs()) setFsUi(false);
}));
window.addEventListener('resize',()=>{ if(isFs()) fitWrap(); });
$('#fsBtn').innerHTML=FS_IN;
if(window.ResizeObserver) new ResizeObserver(relayout).observe(wrap); else window.addEventListener('resize',relayout);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);

// ---------- start ----------
MQ.addEventListener('change',()=>{ if(S.view==='play'){ renderScene(); refresh(); } });
if(!scenes().some(s=>s.id===S.sceneId)) S.sceneId='tea';
fullRender();
})();
